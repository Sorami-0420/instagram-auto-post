name: Instagram Auto Post

on:
  schedule:
    # GitHubは毎時0分が混雑して遅れる・捨てられることがあるため、0分を避けてずらしている
    - cron: "7 22 * * *"  # 毎日 07:07 JST(ストーリーズ朝用)
    - cron: "37 22 * * *" # 毎日 07:37 JST(予備)
    - cron: "7 3 * * *"   # 毎日 12:07 JST(昼の予備・文章づくり)
    - cron: "7 11 * * *"  # 毎日 20:07 JST(夜の投稿)
    - cron: "37 11 * * *" # 毎日 20:37 JST(予備)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "true=投稿せずキャプション確認のみ / false=実際に投稿する"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run posting script
        working-directory: scripts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 定期実行(schedule)ではリポジトリ変数 TEST_MODE を使う。
          # 手動実行(workflow_dispatch)のときはその場で選んだ値を優先する。
          TEST_MODE: ${{ github.event.inputs.test_mode || vars.TEST_MODE || 'true' }}
        run: python main.py
